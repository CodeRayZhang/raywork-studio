[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raywork-studio"
version = "0.2.0"
description = "An evidence-aware content delivery workspace for small studios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[project.scripts]
raywork = "raywork.cli:main"

[tool.setuptools.package-data]
raywork = ["static/*"]

[tool.setuptools.packages.find]
include = ["raywork*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
